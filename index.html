<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caffeine Drive | Link in Bio</title>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* CSS RESET & VARIABLES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --text-main: #EEEEEE;
            --text-muted: #888888;
            --accent-crimson: #E63946;
            --accent-cyan: #00F5D4;
            --border-color: #2A2A2A;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
            -webkit-font-smoothing: antialiased;
        }

        /* CONTAINER LAYOUT */
        .container {
            width: 100%;
            max-width: 480px; /* Standard mobile-first container max-width */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* HEADER SECTION */
        .header {
            margin-bottom: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-crimson);
            margin-bottom: 16px;
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.2);
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        .band-name {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .bio {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 400;
            line-height: 1.4;
            max-width: 320px;
        }

        /* LINKS SECTION */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 20px;
            background-color: var(--card-bg);
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* BUTTON HOVER & ACTIVE STATES */
        .link-btn:hover {
            border-color: var(--accent-crimson);
            color: #FFFFFF;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.25);
            background-color: #252525;
        }

        .link-btn:active {
            transform: translateY(0);
        }

        /* Highlight feature for booking button */
        .link-btn.featured {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 245, 212, 0.15);
        }

        .link-btn.featured:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 4px 15px rgba(0, 245, 212, 0.3);
        }

        /* FOOTER SECTION */
        .footer {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <main class="container">
        
        <!-- HEADER SECTION -->
        <header class="header">
            <!-- REPLACE 'https://via.placeholder.com/100' WITH YOUR LOGO IMAGE FILE PATH OR IMAGE URL -->
            <img src="src/Launcher Studio Logo.png" alt="Caffeine Drive Logo" class="avatar">
            
            <h1 class="band-name">Caffeine Drive</h1>
            <p class="bio">Aspiring OPM Emo Pop Punk band from Antipolo 🇵🇭</p>
        </header>

        <!-- SOCIAL & LINKS SECTION -->
        <nav class="links-container">
            <!-- Replace the href="#" values below with your actual profile links -->
            
            <!-- <a href="https://spotify.com" target="_blank" rel="noopener noreferrer" class="link-btn">
                🎵 Spotify / Stream Our Music
            </a> -->

            <a href="https://www.tiktok.com/@caffeine.drive" target="_blank" rel="noopener noreferrer" class="link-btn">
                🎬 TikTok
            </a>

            <a href="https://www.instagram.com/caffeine_drive/" target="_blank" rel="noopener noreferrer" class="link-btn">
                📸 Instagram
            </a>

            <a href="https://www.facebook.com/profile.php?id=100063847811624" target="_blank" rel="noopener noreferrer" class="link-btn">
                📘 Facebook
            </a>

            <a href="https://www.youtube.com/@Caffeine_Drive" target="_blank" rel="noopener noreferrer" class="link-btn">
                📺 YouTube
            </a>

            <a href="mailto:caffeinedrive.band@gmail.com?subject=Gig%20Booking%20Inquiry%20-%20Caffeine%20Drive" class="link-btn featured">
                📩 Gig Bookings & Inquiries
            </a>
        </nav>

        <!-- FOOTER SECTION -->
        <footer class="footer">
            <p>&copy; 2026 Caffeine Drive. All rights reserved.</p>
        </footer>

    </main>

</body>
</html>
